[package]
name = "navette"
version.workspace = true
edition = "2024"
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Unified optical thin-film engine: color, interpolation, S-matrix, spectral weaving, materials, stack model."
readme = "../../README.md"
keywords = ["optics", "thin-film", "color", "interpolation", "spectral"]
categories = ["science"]

[lib]
name = "navette"
crate-type = ["rlib"]

[features]
default = []
# Optional least-squares backends (synthesis::optimizer, R4.4c). Off by
# default: a standard build pulls no new dependencies, and a backend that is
# not compiled in is an error with a rebuild hint, never a silent fallback.
# Both crates are MIT, which is compatible with this crate's LGPL-3.0-or-later.
opt-minpack-lm = ["dep:levenberg-marquardt", "dep:nalgebra"]

[dependencies]
rayon = { workspace = true }
num-complex = { workspace = true }
ndarray = { workspace = true }
# Must match numpy 0.28's ndarray (0.17) so core arrays convert to Python.
ndarray017 = { package = "ndarray", version = "0.17" }
realfft = "3.3"
parking_lot = "0.12"
lru = "0.12"
bytemuck = "1"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
ahash = "0.8"
smallvec = "1.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.9"
rand_distr = "0.5"
# --- optional optimizer backends (see [features]) --------------------------
# The argmin ecosystem's reference LM (MINPACK lmdif-derived, MIT). Pinned to
# the nalgebra major it was built against so an argmin backend added later can
# share the same one.
levenberg-marquardt = { version = "0.15", optional = true }
nalgebra = { version = "0.34", optional = true }

[dev-dependencies]
# .npy reading for golden-parity tests. default-features=false avoids the
# npz/flate2 stack so the dev build stays clean on older toolchains.
ndarray-npy = { version = "0.8", default-features = false }
approx = "0.5"
