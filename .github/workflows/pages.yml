# Project site: build the figures with the released package, deploy to GitHub Pages.
#
# One-time setup (owner action, not in this file): Settings -> Pages ->
# Build and deployment -> Source: "GitHub Actions".
#
# Every chart on the site is drawn from site/data/figures.json, and this
# workflow regenerates that file from the navette wheel on PyPI before
# deploying, so the page shows what the released engine computes. The
# quick-start snippet the page quotes is run too, so it cannot drift from
# the API it advertises.
#
# The wheel installed is the version the checked-out tree declares
# (pyproject.toml), never "whatever PyPI has": a site change pushed ahead
# of its release is built when that release lands, not against the old
# engine. Until the version is on PyPI the run builds nothing and says so.
# A successful `release` run triggers this workflow on the released commit.

name: pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "examples/rugate_gradient_vs_discrete.py"
      - "examples/dual_band_ar.py"
      - ".github/workflows/pages.yml"
  workflow_run:
    workflows: [release]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.12"

jobs:
  # Is the version this tree declares on PyPI? After a release the index can
  # lag the upload by a minute or two, so a release-triggered run retries.
  version:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      released: ${{ steps.check.outputs.released }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - id: check
        shell: bash
        run: |
          V=$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)
          echo "version=$V" >> "$GITHUB_OUTPUT"
          tries=1; [ "${{ github.event_name }}" = workflow_run ] && tries=10
          for i in $(seq "$tries"); do
            if python -m pip download --no-deps --quiet -d /tmp/probe "navette==$V"; then
              echo "released=true" >> "$GITHUB_OUTPUT"; exit 0
            fi
            [ "$i" -lt "$tries" ] && sleep 30
          done
          echo "released=false" >> "$GITHUB_OUTPUT"
          echo "::notice::navette $V is not on PyPI yet; the site is built when it is released."

  build:
    needs: version
    if: needs.version.outputs.released == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: install the released package
        run: python -m pip install --upgrade pip "navette==${{ needs.version.outputs.version }}"
      - name: quick-start snippet still runs
        run: python site/scripts/snippet_check.py
      - name: compute the figures
        run: python site/scripts/build_data.py
      # Pages serves every file with a 10-minute cache, each on its own clock,
      # so a fresh main.js could meet a stale figures.json and fail on a key
      # the old data lacks. Stamping the commit onto each URL keeps them one set.
      - name: stamp the asset URLs with the commit
        run: |
          v="${GITHUB_SHA::7}"
          sed -i "s|assets/style.css\"|assets/style.css?v=$v\"|; s|assets/main.js\"|assets/main.js?v=$v\"|" site/index.html
          sed -i "s|\"./charts.js\"|\"./charts.js?v=$v\"|; s|\"data/figures.json\"|\"data/figures.json?v=$v\"|" site/assets/main.js
          test "$(grep -c "?v=$v" site/index.html)" -eq 2
          test "$(grep -c "?v=$v" site/assets/main.js)" -eq 2
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
