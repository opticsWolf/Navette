# Push/PR gate. Before this existed only `release.yml` ran, and only on a
# tag: a broken example, unsynced request bits and a tree full of live
# compiler warnings all survived the 0.5.0 release. (R2.3, review §7.)
#
# What is BLOCKING here is what the tree can actually satisfy today:
#   * cargo test --workspace          (376 tests)
#   * rustc -D warnings               (zero warnings as of 0.5.5)
#   * pytest validation               (450 tests, Windows + Linux)
#   * tools/check_exposure.py         (README claims it is "enforced in CI" —
#                                      as of this workflow that is finally true)
#   * tools/check_cie_sync.py
#   * dependency floors               (R4.1: a floor with no wheel is fiction)
#   * build_profile() == "release"    (R2.1: PEP 517 builds must be optimized)
#
# What is ADVISORY (continue-on-error) and why:
#   * cargo clippy  — 248 findings on the current tree
#   * cargo fmt     — 981 files differ from rustfmt defaults
# Both are tracked as their own items. Turning either blocking means landing
# a large mechanical diff first; doing it inside this commit would bury the
# gate itself. A gate that cannot go green teaches people to ignore CI, so
# these report without failing until that work lands.
#
# The `dependency-floors` job was advisory until R4.1 (0.6.3) fixed the floors
# it was failing on. It is blocking now.

name: ci

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  rust:
    name: rust (test + warnings)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2

      - name: cargo test --workspace
        run: cargo test --workspace

      - name: no compiler warnings
        env:
          RUSTFLAGS: "-D warnings"
        run: cargo check --workspace --all-targets

      - name: clippy (advisory)
        continue-on-error: true
        run: cargo clippy --workspace --all-targets

      - name: rustfmt (advisory)
        continue-on-error: true
        run: cargo fmt --all --check

  python:
    name: python (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # The maturin PEP 517 backend builds release; `maturin develop` without
      # --release does not. Asserted below rather than assumed (R2.1).
      - name: install (editable, native extension)
        run: python -m pip install -e ".[dev]"

      - name: extension is a release build
        shell: bash
        run: |
          P=$(python -c "import navette; print(navette.build_profile())")
          echo "build_profile=$P"
          test "$P" = "release" || { echo "CI is testing a $P build"; exit 1; }

      - name: pytest validation
        run: python -m pytest validation

      - name: exposure lint (Rust <-> Python surface)
        run: python tools/check_exposure.py

      - name: embedded CIE tables match sources
        run: python tools/check_cie_sync.py

  dependency-floors:
    # A declared floor is a promise: "this package works with at least this
    # version". Before R4.1 every floor in pyproject.toml was fiction --
    # numpy 1.22, scipy 1.8, PyYAML 6.0 and numba 0.56 all predate cp312
    # wheels, while requires-python says >=3.12. Nothing could have installed
    # that combination.
    #
    # So this job does not check one dependency by name. It reads every
    # `>=` floor out of pyproject.toml, pins them ALL at once, and runs the
    # suite against that. Checking numpy alone would have let the other three
    # stay broken behind a green check.
    name: dependency floors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          # Deliberately the LOWEST supported Python, not the newest: the
          # floors have to hold where they are hardest to satisfy.
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: build and install the package
        run: python -m pip install -e ".[dev]"

      - name: pin every declared floor
        run: |
          python - <<'PY' > floors.txt
          import pathlib, re, tomllib
          data = tomllib.loads(pathlib.Path("pyproject.toml").read_text(encoding="utf-8"))
          project = data["project"]
          specs = list(project.get("dependencies", []))
          specs += project.get("optional-dependencies", {}).get("numba", [])
          for spec in specs:
              m = re.match(r"^([A-Za-z0-9_.\-]+)\s*>=\s*([0-9][0-9A-Za-z.]*)", spec)
              if m:
                  print(f"{m.group(1)}=={m.group(2)}")
          PY
          echo "pinning:"; cat floors.txt
          # --only-binary: a floor with no wheel for the declared Python is
          # not a usable floor. Without this, pip falls back to the sdist and
          # dies with an unrelated build error that hides the real finding.
          python -m pip install --only-binary=:all: -r floors.txt || {
            echo "::error::the declared floors in pyproject.toml do not install"
            echo "::error::together on Python ${{ env.PYTHON_VERSION }} as wheels."
            echo "::error::A floor that cannot be installed is not a floor. See R4.1."
            exit 1
          }
          python -m pip check

      - name: report what is actually installed
        run: python -m pip list

      - name: the suite must pass at the floor
        # Importing is not enough: a floor that imports but breaks a kernel is
        # still a lie. The whole suite runs in seconds, and pinning the numba
        # extra above means the parity layer compares against its reference
        # here rather than skipping.
        run: python -m pytest validation -q
