# Release: tag `vX.Y.Z` (must match pyproject + workspace Cargo versions).
#
# One-time setup (owner actions, not in this file):
# 1. PyPI: register project `navette`, add a trusted publisher
#    (this repo + workflow `release.yml` + environment `pypi`).
#    No token needed afterwards.
# 2. GitHub: create environment `pypi` (optional reviewers) and secret
#    `CARGO_REGISTRY_TOKEN` (crates.io API token, scope: publish).
#
# Flow: check tag↔versions → build wheels (3 OS, abi3) → PyPI (OIDC) →
# crates.io (token), single `navette` crate.
#
# Correctness is gated by `ci.yml` on push/PR, so a tag points at a commit
# that has already been through the suites. This workflow re-checks only
# what is release-specific: tag/version agreement (now including Cargo.lock)
# and CIE table sync.

name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"

jobs:
  check-cie-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: embedded CIE tables match sources
        run: python tools/check_cie_sync.py

  check-versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: tag matches package versions
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          PY=$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)
          RS=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          PYABOUT=$(grep -m1 '__version__' src/navette/__about__.py | cut -d'"' -f2)
          # The lock was NOT checked here until 0.5.6 and silently lagged a
          # release behind (0.5.1 while Cargo.toml said 0.5.2): it passed this
          # gate while dirtying the tree on the first `cargo build`.
          LOCK=$(grep -A1 -m1 '^name = "navette"$' Cargo.lock | grep -m1 '^version = ' | cut -d'"' -f2)
          LOCKPY=$(grep -A1 -m1 '^name = "navette-py"$' Cargo.lock | grep -m1 '^version = ' | cut -d'"' -f2)
          # The internal path dependency carries its own version requirement.
          DEP=$(grep -m1 '^navette = { version = ' Cargo.toml | cut -d'"' -f2)
          echo "tag=$TAG pyproject=$PY workspace=$RS about=$PYABOUT dep=$DEP lock=$LOCK lock-py=$LOCKPY"
          fail=0
          for pair in "pyproject:$PY" "workspace:$RS" "about:$PYABOUT" \
                      "cargo-dep:$DEP" "lock-navette:$LOCK" "lock-navette-py:$LOCKPY"; do
            name=${pair%%:*}; value=${pair#*:}
            [ "$value" = "$TAG" ] || { echo "::error::$name=$value does not match tag $TAG"; fail=1; }
          done
          [ $fail -eq 0 ] || exit 1

  build-wheels:
    needs: [check-versions, check-cie-sync]
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: dtolnay/rust-toolchain@stable
      - name: build wheel
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: dist/*.whl

  publish-pypi:
    needs: build-wheels
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # trusted publishing (no token)
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1

  publish-crates:
    needs: [check-versions, check-cie-sync]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: publish navette (retry/backoff; skips already-live)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        shell: bash
        run: |
          attempt=1 out=
          while [ $attempt -le 6 ]; do
            echo "--- attempt $attempt ---"
            if out=$(cargo publish -p navette --no-verify 2>&1); then
              echo "$out" | tail -n 2
              break
            fi
            echo "$out" | tail -n 3
            if echo "$out" | grep -iq "already upload\|already publish\|already exist"; then
              echo "navette already live, skipping."
              break
            fi
            sleep $((attempt * 120))  # 429/index-lag backoff
            attempt=$((attempt + 1))
          done
          [ $attempt -le 6 ]
